<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><title>Coding Tools Browser Surface</title>
  <style>
    body { font: 18px system-ui; margin: 28px; }
    #status { font-size: 24px; font-weight: 700; margin-bottom: 22px; }
    input, button { font: inherit; padding: 10px; margin-right: 12px; }
    #right { margin-top: 24px; padding: 32px; background: #eaf5ff; }
    #scroll { height: 220px; overflow-y: scroll; margin-top: 24px; border: 2px solid #567; padding: 12px; }
    .spacer { height: 1000px; background: linear-gradient(#fff, #dff); }
  </style>
</head>
<body>
  <div id="status" role="status">STATUS: READY</div>
  <label for="test-input">Test input</label>
  <input id="test-input" aria-label="Test input">
  <button id="click-button">Click test button</button>
  <div id="right" role="button" tabindex="0" aria-label="Right click test area">Right click test area</div>
  <div id="scroll" role="region" tabindex="0" aria-label="Scrollable test area"><div class="spacer">Scrollable start</div><div>Scrollable end</div></div>
  <script>
    const status = document.querySelector('#status');
    const input = document.querySelector('#test-input');
    document.querySelector('#click-button').addEventListener('click', () => status.textContent = 'STATUS: CLICKED');
    document.querySelector('#right').addEventListener('contextmenu', event => {
      event.preventDefault(); status.textContent = 'STATUS: RIGHT_CLICKED';
    });
    input.addEventListener('input', () => status.textContent = 'STATUS: TEXT=' + input.value);
    input.addEventListener('keydown', event => {
      if (event.key === 'F2') { event.preventDefault(); status.textContent = 'STATUS: KEY=F2'; }
    });
  </script>
</body>
</html>
